# Publishes the browser app to GitHub Pages (https://coral-coder.github.io/opentcg/) on every
# push to main that touches the app, the engines or the card data, and by hand.
#
# Needs Pages turned on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
# A private repository needs a paid GitHub plan for Pages, and the published site is public.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "packages/**"
      - "data/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the browser app
        run: |
          flutter build web --release --base-href /opentcg/
          touch build/web/.nojekyll
      # Lorcana card images served by the site itself, so the game draws them on its canvas
      # (tool/lorcana_images.py says why). Cached, so only new cards are fetched.
      - uses: actions/cache@v4
        with:
          path: .lorcana-images
          key: lorcana-images-${{ hashFiles('data/lorcana-cards.json', 'data/lorcast-cards.json', 'tool/lorcana_images.py') }}
          restore-keys: lorcana-images-
      - name: Lorcana card images
        run: |
          pip install --quiet pillow
          python3 tool/lorcana_images.py data/lorcana-cards.json .lorcana-images --lorcast data/lorcast-cards.json
          cp -r .lorcana-images build/web/lorcana-images
          du -sh build/web build/web/lorcana-images
      # The same for Riftbound: Riot's image host doesn't allow cross-origin reads either.
      - uses: actions/cache@v4
        with:
          path: .riftbound-images
          key: riftbound-images-${{ hashFiles('data/riftbound-cards.json', 'tool/riftbound_images.py') }}
          restore-keys: riftbound-images-
      - name: Riftbound card images
        run: |
          python3 tool/riftbound_images.py data/riftbound-cards.json .riftbound-images
          cp -r .riftbound-images build/web/riftbound-images
          du -sh build/web/riftbound-images
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
