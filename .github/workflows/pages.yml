# Publishes the browser app to GitHub Pages (https://coral-coder.github.io/opentcg/) on every
# push to main that touches the app, the engines or the card data, and by hand.
#
# Needs Pages turned on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
# A private repository needs a paid GitHub plan for Pages, and the published site is public.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "packages/**"
      - "data/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the browser app
        run: |
          flutter build web --release --base-href /opentcg/
          touch build/web/.nojekyll
          du -sh build/web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
