name: opentcg
description: OpenTCG — trading card games on one table (Magic, Lorcana), grown from OpenMTG. Private.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Shared core, app shell and Magic, from the public OpenMTG repository.
  tcg_core:
    git:
      url: https://github.com/Coral-coder/openmtg.git
      ref: 4bc649b56d3b6e02493497d38911f0ac40c3e177
      path: packages/tcg_core
  tcg_app:
    git:
      url: https://github.com/Coral-coder/openmtg.git
      ref: 4bc649b56d3b6e02493497d38911f0ac40c3e177
      path: packages/tcg_app
  mtg_ui:
    git:
      url: https://github.com/Coral-coder/openmtg.git
      ref: 4bc649b56d3b6e02493497d38911f0ac40c3e177
      path: packages/mtg_ui
  lorcana:
    path: packages/lorcana
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Magic's engine, for the test that a Magic device and a Lorcana device refuse to pair.
  rules:
    git:
      url: https://github.com/Coral-coder/openmtg.git
      ref: 4bc649b56d3b6e02493497d38911f0ac40c3e177
      path: packages/rules

flutter:
  uses-material-design: true
  assets:
    - data/lorcana-cards.json
